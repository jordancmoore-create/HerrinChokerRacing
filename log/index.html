<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go Fast Logs — Herrin Choker Racing #38</title>
<link rel="stylesheet" href="vendor/uPlot.min.css">
<link rel="stylesheet" href="styles.css?v=22">
<script>document.documentElement.dataset.theme = localStorage.getItem('inferno-theme') || 'dark';</script>
</head>
<body>
<header class="topbar">
  <button class="brand" id="homeBtn" title="Home" aria-label="Home — back to log library">
    <span class="logo">38</span>
    <div class="brand-text"><span class="brand-name">Go Fast Logs</span><small>Herrin Choker Racing · #38</small></div>
  </button>
  <div class="spacer"></div>
  <button class="ghost-btn" id="openBtn" title="Add log"><span class="bi">＋</span><span class="bl">Add log</span></button>
  <button class="ghost-btn icon-btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle theme">☀</button>
</header>

<main>
  <div id="landing">
    <div class="dropzone" id="dropzone">
      <div class="icon">📈</div>
      <div class="big">Drop your ECU log files here</div>
      <div class="sub">.llgx files from PCLink — drag in one or many. Everything runs &amp; saves locally.</div>
    </div>
    <section class="history" id="history"></section>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="dashboard">
    <section class="session" id="session">
      <h1 id="sessionTitle"></h1>
      <div class="chips" id="chips"></div>
      <div class="timeline" id="timeline"></div>
    </section>
    <section class="kpi-grid" id="kpis"></section>
    <div class="scope-label" id="flagsLabel" style="display:none">This run</div>
    <section class="flags" id="flags"></section>
    <section class="trends" id="trends" style="display:none"></section>
    <div class="view-toggle" id="viewToggle"></div>
    <section class="charts" id="charts"></section>
    <section class="readout" id="readout"></section>
  </div>
</main>

<input type="file" id="fileInput" accept=".llgx" multiple hidden>

<script src="vendor/uPlot.iife.min.js"></script>
<script src="units.js?v=22"></script>
<script src="db.js?v=22"></script>
<script src="cloud.js?v=22"></script>
<script src="history.js?v=22"></script>
<script src="llgx.js?v=22"></script>
<script src="analysis.js?v=22"></script>
<script src="charts.js?v=22"></script>
<script src="app.js?v=22"></script>
<script>document.getElementById('openBtn').onclick=()=>document.getElementById('fileInput').click();</script>
</body>
</html>
